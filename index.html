<!DOCTYPE html>
<html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#0e0d0b"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Executive Lab">
<title>Executive Lab</title>
<style>
/* como uma app instalada: sem zoom, sem a página a esticar */
html,body{overscroll-behavior:none;touch-action:pan-x pan-y;-webkit-text-size-adjust:100%}
body{padding-top:env(safe-area-inset-top,0px)}
/* barra de estado do iPhone (hora, bateria): o conteúdo desvanece por baixo, como nas apps da Apple */
body::before{content:'';position:fixed;left:0;right:0;top:0;height:calc(env(safe-area-inset-top,0px) + 12px);background:linear-gradient(to bottom,var(--bg) 0,var(--bg) calc(100% - 12px),transparent);z-index:1000;pointer-events:none}
@supports not (height:env(safe-area-inset-top)){body::before{display:none}}


/* Layout: entrada por código → título grande + separadores (Trabalhos | Calendário | Histórico); listas agrupadas iOS; pedido, ficha e ajustes em folhas */
:root{
  --bg:#F2F2F7; --card:#FFFFFF; --fill:#E9E9EE; --sep:#E0E0E5; --fg:#1C1C1E; --muted:#8A8A8F;
  --blue:#007AFF; --green:#28A745; --orange:#E07B00; --red:#E5372C;
  --red-s:rgba(229,55,44,.12); --orange-s:rgba(224,123,0,.13); --green-s:rgba(40,167,69,.13); --blue-s:rgba(0,122,255,.12); --gray-s:rgba(120,120,128,.12);
  --av-a:#0A6CD6; --av-f:#A2845E; --glass:rgba(249,249,251,.86);
  --font:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
  --display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --sep:#38383A; --fg:#F2F2F7; --muted:#98989F;
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
  --red-s:rgba(255,69,58,.2); --orange-s:rgba(255,159,10,.2); --green-s:rgba(48,209,88,.18); --blue-s:rgba(10,132,255,.22); --gray-s:rgba(120,120,128,.24);
  --av-a:#0A84FF; --av-f:#AC8E68; --glass:rgba(28,28,30,.86); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --card:#1C1C1E; --fill:#2C2C2E; --sep:#38383A; --fg:#F2F2F7; --muted:#98989F;
  --blue:#0A84FF; --green:#30D158; --orange:#FF9F0A; --red:#FF453A;
  --red-s:rgba(255,69,58,.2); --orange-s:rgba(255,159,10,.2); --green-s:rgba(48,209,88,.18); --blue-s:rgba(10,132,255,.22); --gray-s:rgba(120,120,128,.24);
  --av-a:#0A84FF; --av-f:#AC8E68; --glass:rgba(28,28,30,.86); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.4 var(--font);margin:0;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:8px 60px}
.wrap.wide{max-width:1100px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
svg{flex:none}

/* Cabeçalho */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px}
.who{display:flex;align-items:center;gap:8px;font-size:.84rem;color:var(--muted);min-width:0}
.who b{color:var(--fg);font-weight:600}
.iconbtn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.iconbtn svg{width:22px;height:22px}
.plus{width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center}
.plus svg{width:18px;height:18px}
h1{font:700 2.1rem/1.1 var(--display);letter-spacing:-.02em;margin:10px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}

/* Segmented */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--fill);border-radius:9px;padding:2px}
.seg button{padding:6px 10px;border-radius:7px;font-size:.88rem;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.seg.main{margin-bottom:20px}
.seg.sm button{padding:4px 8px;font-size:.8rem}

/* Listas */
.group{margin-bottom:26px}
.gh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:0 16px 6px;font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.list{background:var(--card);border-radius:12px;overflow:hidden}
.rowi{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:11px 16px;position:relative;min-height:48px}
.rowi+.rowi::before,.field+.field::before,.field+.rowi::before,.rowi+.field::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--sep)}
button.rowi:active{background:var(--fill)}
.rowi .main{flex:1;min-width:0}
.rowi .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rowi .s{font-size:.84rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrapt .t,.wrapt .s{white-space:normal}
.chev{color:var(--muted);opacity:.6;font-size:1.1rem;flex:none}
.empty{padding:16px;color:var(--muted);text-align:center}
.link{color:var(--blue);text-transform:none;letter-spacing:0;font-size:.84rem;font-weight:500}
.foot{font-size:.78rem;color:var(--muted);padding:6px 16px 0}

/* Estados */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:600;padding:3px 8px 3px 6px;border-radius:999px;white-space:nowrap;background:var(--gray-s);color:var(--muted)}
.tag svg{width:12px;height:12px}
.tag-crit{background:var(--red-s);color:var(--red)} .tag-warn{background:var(--orange-s);color:var(--orange)}
.tag-new{background:var(--blue-s);color:var(--blue)} .tag-ok{background:var(--green-s);color:var(--green)}
.aic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none}
.aic svg{width:16px;height:16px}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:600;flex:none;font-size:.95rem}
.av.sm{width:22px;height:22px;font-size:.7rem}
.av-A{background:var(--av-a)} .av-F{background:var(--av-f)}
.side{display:grid;justify-items:end;gap:5px;flex:none}
.side .when{font-size:.78rem;color:var(--muted);white-space:nowrap}
.side .when.hot{color:var(--red);font-weight:600}
.fase{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--blue)}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:999px;padding:6px 14px;font-size:.84rem;font-weight:600;flex:none}
.pill.ghost{background:var(--blue-s);color:var(--blue)}
.pill.green{background:var(--green)}
.key{display:flex;flex-wrap:wrap;gap:14px;font-size:.78rem;color:var(--muted);padding:0 16px 16px}
.key span{display:inline-flex;align-items:center;gap:6px}
.key i{width:10px;height:10px;border-radius:50%}

/* Resumo */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:22px}
.tile{background:var(--card);border-radius:14px;padding:12px 14px;text-align:left;display:grid;gap:8px}
.tile .top{display:flex;justify-content:space-between;align-items:center}
.tile .ic{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:#fff}
.tile .ic svg{width:16px;height:16px}
.tile b{font:700 1.75rem/1 var(--display);font-variant-numeric:tabular-nums}
.tile span.l{font-size:.8rem;color:var(--muted);font-weight:500}
.tile[aria-pressed="true"]{box-shadow:inset 0 0 0 2px var(--blue)}
.tile.zero b{color:var(--muted)}

/* Calendário */
.calnav{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.calnav h2{font:700 1.3rem var(--display);margin:0;letter-spacing:-.01em}
.calnav .ctl{display:flex;align-items:center;gap:4px}
.calnav .ctl button{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:var(--blue)}
.calnav .ctl button svg{width:20px;height:20px}
.calnav .ctl .today{width:auto;padding:0 12px;border-radius:999px;background:var(--blue-s);font-weight:600;font-size:.84rem}
.cal{background:var(--card);border-radius:12px;overflow:hidden}
.cal-h{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));text-align:center;font-size:.7rem;color:var(--muted);text-transform:uppercase;padding:8px 0 4px}
.cal-g{display:grid;grid-template-columns:repeat(6,minmax(0,1fr))}
.cd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px 8px;min-width:0;border-top:1px solid var(--sep)}
.cd .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:.95rem;font-variant-numeric:tabular-nums}
.cd .m{font-size:.6rem;color:var(--muted);font-weight:700;text-transform:uppercase;height:.75rem;line-height:.75rem}
.cd.past .n{color:var(--muted)}
.cd.today .n{background:var(--blue);color:#fff;font-weight:700}
.cd.sel .n{box-shadow:0 0 0 2px var(--fg)}
.cd.sel.today .n{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--blue)}
.dots{display:flex;gap:3px;height:6px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--muted)}
.dots i.p{background:none;box-shadow:inset 0 0 0 1.5px var(--blue)}
.dayh{display:flex;justify-content:space-between;padding:10px 16px 2px;font-size:.72rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.dayh.hoje{color:var(--blue)}
.crow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 16px;font-size:.86rem;min-width:0}
.crow:active{background:var(--fill)}
.crow .h{width:40px;flex:none;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.crow .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:0 1 auto}
.crow .ds{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0;flex:1 1 0;font-size:.8rem}
.crow .dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--muted)}
.crow .fp{font-size:.62rem;font-weight:700;color:var(--blue);flex:none}
.wk{padding-bottom:8px}
.imedn{font-size:.78rem;color:var(--muted)}
.d-new{background:var(--blue)!important} .d-ok{background:var(--green)!important} .d-warn{background:var(--orange)!important} .d-crit{background:var(--red)!important}

/* Histórico */
.search{display:flex;align-items:center;gap:8px;background:var(--fill);border-radius:10px;padding:8px 10px;margin-bottom:12px}
.search svg{width:16px;height:16px;color:var(--muted)}
.search input{flex:1;min-width:0;border:0;background:none;outline:none}
.hfilters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;align-items:center}
.hfilters select{background:var(--card);border:0;border-radius:9px;padding:6px 10px;font-size:.84rem}
.stats{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.84rem;color:var(--muted);margin:-6px 4px 18px}
.stats b{color:var(--fg);font-variant-numeric:tabular-nums}

/* Barra inferior (telemóvel) */
.tabbar{display:none}
.tabbar button{display:grid;justify-items:center;gap:2px;font-size:.66rem;color:var(--muted);font-weight:500;padding:4px 0}
.tabbar button[aria-pressed="true"]{color:var(--blue)}
.tabbar svg{width:24px;height:24px}
.tabbar .pl{width:48px;height:32px;border-radius:16px;background:var(--blue);color:#fff;display:grid;place-items:center}
.tabbar .pl svg{width:20px;height:20px}
@media (max-width:699px){
  .seg.main,.plus{display:none}
  .tabbar{display:grid;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-auto-flow:column;grid-auto-columns:1fr;align-items:end;background:var(--glass);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--sep);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .wrap{padding-bottom:110px}
  .tile{padding:10px 12px} .tile b{font-size:1.5rem}
}

/* Entrada */
.login{position:relative;overflow:hidden;min-height:100vh;min-height:100dvh;padding:40px 16px;display:grid;place-items:center;color:#F3EDE2;background:radial-gradient(90% 55% at 50% 0%,#3b3121 0%,#1b1813 48%,#0e0d0b 100%)}
.login .lbg{position:absolute;right:-22vmax;bottom:-16vmax;width:78vmax;opacity:.07;pointer-events:none;transform:rotate(-9deg)}
.login .lbox{position:relative;animation:up .5s ease both}
.login .lx{display:block;width:62px;margin:0 auto 16px;filter:drop-shadow(0 8px 22px rgba(196,162,90,.35))}
.login h1{font:400 2.15rem/1.1 Didot,"Bodoni 72","Bodoni MT","Playfair Display",Georgia,serif;letter-spacing:.01em;color:#F6F0E4}
.login .lsub{margin:9px 0 0;font:600 .66rem var(--font);letter-spacing:.34em;text-transform:uppercase;color:#C4A25A}
.login .lask{margin:6px 0 0;color:rgba(243,237,226,.62);font-size:.9rem}
.login .pin i{box-shadow:inset 0 0 0 1.5px #C4A25A}.login .pin i.on{background:#C4A25A}
.login .pad button{background:rgba(255,255,255,.055);color:#F6F0E4;border:1px solid rgba(196,162,90,.22);touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background .08s}
.login .pad button:active{background:rgba(196,162,90,.3)}
.login .pad .blank{border:0}.login .hint{color:rgba(243,237,226,.45)}.login .err{color:#FF9B8A}
.lbox{width:min(360px,100%);text-align:center;display:grid;gap:18px}
.lbox h1{margin:0}
.pin{display:flex;justify-content:center;gap:14px}
.pin i{width:14px;height:14px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--fg)}
.pin i.on{background:var(--fg)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;justify-content:center}
.pad button{width:72px;height:72px;border-radius:50%;background:var(--card);font:500 1.6rem var(--display)}
.pad button:active{background:var(--fill)}
.pad .blank{background:none}
.hint{font-size:.78rem;color:var(--muted);line-height:1.6}
.err{color:var(--red);font-size:.86rem;min-height:1.2em}

/* Folhas */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.32);z-index:40}
.sheet.noanim{animation:none!important}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(640px,100%);max-height:94%;background:var(--bg);z-index:41;border-radius:14px 14px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px)}
@media (min-width:700px){.sheet{top:50%;bottom:auto;transform:translate(-50%,-50%);border-radius:14px;max-height:90%}}
.sh-h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 16px 10px;gap:8px}
.sh-h .l{justify-self:start;color:var(--blue)} .sh-h .r{justify-self:end;color:var(--blue);font-weight:600}
.sh-h h2{font:600 1rem var(--display);margin:0;text-align:center}
.sh-b{overflow-y:auto;padding:6px 16px 28px}
.hero{text-align:center;padding:4px 0 20px}
.hero h3{font:700 1.4rem/1.2 var(--display);margin:0 0 6px;text-wrap:balance}
.hero p{margin:0 0 10px;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap}

/* Campos */
.field{display:flex;align-items:center;gap:12px;padding:0 16px;min-height:46px;position:relative}
.field>label,.field>.lb{flex:none;width:104px}
.field input,.field select{flex:1;min-width:0;border:0;background:none;text-align:right;padding:12px 0;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{outline:none}
.field select{direction:rtl;color:var(--muted)}
.field.col{flex-direction:column;align-items:stretch;padding:10px 16px;gap:8px}
.field.col>label,.field.col>.lb{width:auto;font-size:.84rem;color:var(--muted)}
.field textarea{border:0;background:none;resize:vertical;min-height:64px;padding:2px 0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 12px;border-radius:999px;background:var(--fill);font-size:.86rem;font-weight:500}
.chip[aria-pressed="true"]{background:var(--blue);color:#fff}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tbtn{background:var(--fill);border-radius:10px;padding:10px 12px;text-align:left;font-size:.88rem;font-weight:500;line-height:1.25}
.tbtn[aria-pressed="true"]{background:var(--blue);color:#fff}
.tbtn small{display:block;font-weight:400;opacity:.75;font-size:.74rem}
.tgh{font-size:.72rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:10px 0 6px}
.teeth{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px}
.teeth button{aspect-ratio:1/1.15;max-width:100%;border-radius:6px;background:var(--fill);font-size:.68rem;font-variant-numeric:tabular-nums;padding:0}
.teeth button[aria-pressed="true"]{background:var(--blue);color:#fff}
.teeth .gap{grid-column:span 16;height:6px}
.teeth button:nth-child(8n){margin-right:0}
.drow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:8px;align-items:center}
.drow input{background:var(--fill);border:0;border-radius:8px;padding:8px;text-align:left;min-width:0}
.drow .x{width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--muted)}
.dask{font-size:.8rem;color:var(--orange);font-weight:500}
.photos{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.photos img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.photos.big img{width:96px;height:96px;cursor:zoom-in}
.addph{position:relative;display:inline-flex;align-items:center;gap:8px;color:var(--blue);font-weight:600;background:var(--blue-s);border-radius:10px;padding:10px 14px;cursor:pointer}
.addph svg{width:20px;height:20px}
.fotozona{display:grid;justify-items:center;gap:12px;padding:16px}
.fotozona .addph{font-size:1.02rem;padding:14px 22px;border-radius:14px}
.fotozona .addph svg{width:24px;height:24px}
.fotozona .photos{justify-content:center}
.fotozona .photos img{cursor:zoom-in}
.semfoto{background:var(--orange-s);border-radius:12px;padding:14px 16px;display:grid;gap:10px;margin-bottom:22px}
.semfoto b{font-size:.98rem}
.addph input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.note{font-size:.8rem;padding:6px 16px 0;color:var(--muted)}
.note.warn{color:var(--orange)} .note.crit,.note.err{color:var(--red)}
.btns{display:grid;gap:10px;margin-bottom:26px}
.btn{width:100%;padding:13px;border-radius:12px;background:var(--card);color:var(--blue);font-weight:600;text-align:center}
.btn.fill{background:var(--blue);color:#fff} .btn.red{color:var(--red)} .btn.green{background:var(--green);color:#fff}
.check{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:grid;place-items:center;color:#fff;font-size:.8rem}
.check.on{background:var(--green);border-color:var(--green)}
.check:disabled{opacity:.7;cursor:default}
.msgs{display:grid;gap:6px;padding:12px}
.msg{max-width:82%;padding:8px 12px;border-radius:18px;background:var(--fill);justify-self:start;overflow-wrap:anywhere}
.msg.me{justify-self:end;background:var(--blue);color:#fff}
.msg small{display:block;font-size:.68rem;opacity:.75}
.compose{display:flex;gap:8px;align-items:center;padding:8px 8px 8px 16px;border-top:1px solid var(--sep)}
.compose input{flex:1;min-width:0;border:0;background:none;outline:none;padding:6px 0}
.compose button{color:var(--blue);font-weight:600}
.hist{padding:4px 0}
.hist .rowi{min-height:0;padding:8px 16px;align-items:flex-start}
.hist .q{font-size:.74rem;color:var(--muted);flex:none;width:92px;font-variant-numeric:tabular-nums}
.hist .ht{font-size:.84rem;flex:1;min-width:0}
.stepcfg{display:grid;grid-template-columns:minmax(0,1fr) 56px minmax(0,1.3fr) auto 28px;gap:6px;align-items:center;padding:6px 16px}

/* Etapas por tipo. r: "p" = dias úteis após o pedido · "a" = dias úteis após a etapa anterior (ou da aprovação) · "d" = dias úteis antes da consulta.

  goteira_branqueamento:[{n:"Pronto na gaveta",r:"d",d:1}],
  contencao:[{n:"Pronto na gaveta",r:"d",d:1}],
  goteira_termo:[{n:"Pronto na gaveta",r:"d",d:1}],
  expansor:[{n:"Bandas / componentes",r:"p",d:1},{n:"Soldadura",r:"a",d:2},{n:"Pronto na gaveta",r:"d",d:1}],
  mantenedor:[{n:"Bandas",r:"p",d:1},{n:"Pronto na gaveta",r:"d",d:1}],
  mockup:[{n:"Enceramento",r:"d",d:3,ap:true},{n:"Chaves prontas",r:"d",d:1}],

  alinhadores:[{n:"Impressão",r:"d",d:2},{n:"Prontos",r:"d",d:1}],
  reparacao:[{n:"Pronto",r:"d",d:0}], rebasamento:[{n:"Pronto",r:"d",d:0}],
  moldeira:[{n:"Pronta",r:"d",d:1}], modelo:[{n:"Impresso",r:"d",d:0}], outro:[{n:"Pronto",r:"d",d:1}],
};
const REFS={p:"dias úteis após o pedido",a:"dias úteis após a etapa anterior",d:"dias úteis antes da consulta"};
const LABEST={nao_iniciado:"Não iniciado",em_curso:"Em curso",fresado:"Fresado",acabamento:"Acabamento / polimento",pronto:"Pronto na gaveta",stand_by:"Stand-by",falta_componente:"Falta componente",aguarda_dr:"Aguarda ok do Dr.",adiado:"Adiado"};

/* ======================= Datas ======================= */
const DS=["dom","seg","ter","qua","qui","sex","sáb"],MS=["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MSL=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const pad=n=>String(n).padStart(2,"0");
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const[y,m,d]=s.slice(0,10).split("-").map(Number);return new Date(y,m-1,d)};
const add=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return iso(d)};
const diff=(a,b)=>Math.round((parse(b)-parse(a))/864e5);
const noSun=s=>parse(s).getDay()===0?add(s,1):s;
const util=s=>{const w=parse(s).getDay();return w>0&&w<6};
const addBiz=(s,n)=>{let d=s;while(!util(d))d=add(d,1);let k=0;while(k<n){d=add(d,1);if(util(d))k++}return d};
const subBiz=(s,n)=>{let d=s,k=0;while(k<n){d=add(d,-1);if(util(d))k++}while(!util(d))d=add(d,-1);return d};
const TODAY=iso(new Date());
const fmt=s=>{const d=parse(s);return `${DS[d.getDay()]}, ${d.getDate()} ${MS[d.getMonth()]}`};
const fmtS=s=>{const d=parse(s);return `${d.getDate()} ${MS[d.getMonth()]}`};
const fmtY=s=>{const d=parse(s);return `${d.getDate()} ${MS[d.getMonth()]} ${String(d.getFullYear()).slice(2)}`};
const nowS=()=>{const d=new Date();return `${iso(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function rel(s){const d=diff(TODAY,s);if(d===0)return"Hoje";if(d===1)return"Amanhã";if(d===-1)return"Ontem";const x=parse(s);return `${DS[x.getDay()]}, ${x.getDate()} ${MS[x.getMonth()]}${x.getFullYear()!==parse(TODAY).getFullYear()?" "+String(x.getFullYear()).slice(2):""}`}
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

/* ======================= Dados ======================= */
let JOBS=[];
/* ======================= Servidor (Apps Script) ======================= */
const SERVIDOR="https://script.google.com/macros/s/AKfycbzUW36ofn8AVZ8rtA3K7eX3gBo5Th1MATJmUqMd3RWzCNSQrputj48YSdIeT69IBl7u/exec";
const API=(fn,...args)=>fetch(SERVIDOR,{method:"POST",body:JSON.stringify({fn,args}),redirect:"follow"}).then(r=>{if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(o=>{if(!o.ok)throw new Error(o.erro||"Erro no servidor");return o.r});
const SRV={pin:null,rev:0,dirty:new Set(),cfgDirty:false,saving:false,fotos:{},pendFotos:{}};
function carregar(d){
  JOBS=(d.trabalhos||[]).map(j=>({fotos:[],hi:[],ms:[],etp:{},...j}));
  SRV.rev=d.rev||0;
  const c=d.cfg||{};
  if(c.etapas) for(const k in c.etapas) ETAPAS[k]=c.etapas[k];
  if(c.extra) for(const k in c.extra) TIPOS[k]=c.extra[k];
  if(c.off) for(const k in TIPOS) TIPOS[k].off=!!c.off[k];
}
function cfgAtual(){const off={},extra={};for(const k in TIPOS){if(TIPOS[k].off)off[k]=1;if(/^u\d/.test(k))extra[k]=TIPOS[k]}return {etapas:ETAPAS,off,extra}}
function estadoLigacao(t,bad){let el=document.getElementById("sync");if(!el){el=document.createElement("div");el.id="sync";document.body.append(el)}el.textContent=t;el.className=bad?"bad":"";el.hidden=!t}
async function gravar(){
  if(SRV.saving||!SRV.pin) return; if(!SRV.dirty.size&&!SRV.cfgDirty) return;
  SRV.saving=true;
  try{
    if(SRV.dirty.size){const ids=[...SRV.dirty];SRV.dirty.clear();const lista=JOBS.filter(j=>ids.includes(j.id));
      estadoLigacao("A guardar…");const r=await API("guardarTrabalhos",SRV.pin,JSON.stringify(lista));
      if(!r.ok){ids.forEach(i=>SRV.dirty.add(i));estadoLigacao(r.erro||"Não foi possível guardar.",true)} else {SRV.rev=r.rev;estadoLigacao("")}}
    if(SRV.cfgDirty){SRV.cfgDirty=false;const r=await API("guardarCfg",SRV.pin,JSON.stringify(cfgAtual()));if(!r.ok){SRV.cfgDirty=true;estadoLigacao(r.erro,true)}}
  }catch(e){estadoLigacao("Sem ligação. Vou tentar outra vez.",true)}
  SRV.saving=false;
  if(SRV.dirty.size) setTimeout(gravar,4000);
}
async function atualizar(){
  if(!SRV.pin||SRV.dirty.size||SRV.saving||state.sheet==="novo") return;
  try{const r=await API("dados",SRV.pin,SRV.rev);if(r.ok&&!r.igual&&!SRV.dirty.size){const aberto=state.sheet,antes=JOBS;carregar(r.dados);try{novidades(antes,JOBS)}catch(e){}if(state.user)render();state.sheet=aberto}}catch(e){}
}
function novidades(antes,depois){
  const eu=lab()?"LAB":(state.user&&state.user.n)||"", m=new Map(antes.map(j=>[j.id,j])), avisos=[];
  for(const j of depois){const a=m.get(j.id), hi=j.hi||[], ult=hi[hi.length-1];
    if(!a){ if(!ult||ult.w!==eu) avisos.push("Novo trabalho: "+(j.u||"")); }
    else if(hi.length>(a.hi||[]).length && ult && ult.w!==eu) avisos.push((j.u||"Trabalho")+": "+(ult.t||"atualizado"));}
  if(avisos.length){toast(avisos.length>1?avisos.length+" novidades · "+avisos[0]:avisos[0]);try{navigator.vibrate&&navigator.vibrate([60,40,60])}catch(e){}}
}
setInterval(()=>{if(!document.hidden)atualizar()},8000);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)atualizar()});
function fotoSrc(id){
  if(String(id).startsWith("data:")) return id;
  if(SRV.fotos[id]) return SRV.fotos[id];
  if(!SRV.pendFotos[id]){SRV.pendFotos[id]=1;API("verFoto",SRV.pin,id).then(r=>{if(r.ok){SRV.fotos[id]=r.url;document.querySelectorAll(`img[data-fid="${id}"]`).forEach(im=>im.src=r.url)}})}
  return "data:image/gif;base64,R0lGODlhAQABAIAAAP\/\/\/wAAACH5BAEAAAAALAAAAAABAAEAAAICRAEAOw==";
}
async function enviarFotos(j,urls){
  for(const u of urls){try{const r=await API("guardarFoto",SRV.pin,j.id,u);if(r.ok){j.fotos.push(r.id);SRV.fotos[r.id]=u}}catch(e){toast("Uma foto não foi enviada. Tenta outra vez.")}}
  SRV.dirty.add(j.id); gravar(); if(state.sheet===j.id) renderSheet();
}

/* ======================= Lista de pacientes do iMED/* ======================= Lista de pacientes do iMED ======================= */
let IMED=[]; /* [{n:"Nome completo", k:[tokens]}] — carregada em Ajustes a partir da exportação do iMED */
const normT=n=>(n||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z ]/g," ").split(/\s+/).filter(t=>t.length>1&&!["de","da","do","dos","das","e","sr","sra","dona","dr","dra"].includes(t));
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;if(Math.abs(m-n)>2)return 9;let p=[...Array(n+1).keys()];for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
const tok=(a,b)=>a===b||(a.length>=5&&b.length>=5&&lev(a,b)<=1);
function imedMatch(nome){
  const T=normT(nome); if(T.length<2||!IMED.length) return null;
  const c=IMED.filter(p=>tok(T[0],p.k[0])&&T.every(t=>p.k.some(x=>tok(t,x))));
  return c.length===1?c[0].n:null;
}
function aplicarImed(){for(const j of JOBS) if(!j.imed||j.iq!=="ok"){const m=imedMatch(j.u);if(m){j.imed=m;j.iq="ok";j.ic=null}}}
const nomeC=j=>j.imed||j.u;
/* Utentes vistos nos últimos dias. No ar: vêm do fecho de caixa (agenda + documentos de vendas importados
   pelas assistentes). Neste protótipo: consultas do laboratório dos últimos 14 dias (só para demonstrar). */
function vistos(clin){
  const ini=add(TODAY,-14),m=new Map();
  for(const j of JOBS){ if(j.ex||!j.imed||(clin&&j.cl!==clin)) continue;
    for(const x of j.dt) if(x.d>=ini&&x.d<=TODAY){const k=j.imed; const o=m.get(k); if(!o||o.d<x.d) m.set(k,{n:j.imed,f:j.fi,d:x.d,cl:j.cl})} }
  return [...m.values()];
}
const SUGIM={q:"",lista:[]};
function pedirSug(nome,cb){const q=nome.trim();if(q.length<3||SUGIM.q===q)return;SUGIM.q=q;API("sugerir",SRV.pin,q).then(r=>{if(SUGIM.q===q){SUGIM.lista=r.lista||[];cb&&cb()}}).catch(()=>{})}
function sugestoes(nome,clin){
  const T=normT(nome); if(T.length<1||nome.trim().length<3) return [];
  const bate=k=>T.every(t=>k.some(x=>tok(t,x)||x.startsWith(t)));
  const out=[],seen=new Set();
  for(const v of vistos(clin).sort((a,b)=>b.d.localeCompare(a.d))) if(bate(normT(v.n))&&!seen.has(v.n)){seen.add(v.n);out.push({...v,src:"visto"})}
  for(const p of (SUGIM.lista||[])) if(out.length<6&&!seen.has(p.n)){seen.add(p.n);out.push({n:p.n,f:p.f,src:"imed"})}
  return out.slice(0,5);
}

/* ======================= Estado ======================= */
const state={user:null,clinic:store.get("xl-clinic"),view:"trabalhos",filter:null,sel:TODAY,calOff:0,cfilter:"todas",
  sheet:null,box:null,hq:"",htp:"",hcl:"todas",hmax:60,pin:"",perr:"",form:null};
const WHOL={AVR:"Aveiro",FSC:"Faíscas",LAB:"Milner",GON:"Dr. Gonçalo",CAT:"Dra. Catarina"};
const lab=()=>state.user&&state.user.r==="lab";
const admin=()=>state.user&&(state.user.admin||state.user.r==="lab");
const byId=id=>JOBS.find(j=>j.id===id);

/* ======================= Regras ======================= */
const ativos=j=>j.dt.filter(x=>!x.o);
function proxima(j){const a=ativos(j).filter(x=>x.d>=TODAY).sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h));return a[0]||null}
function ultima(j){const a=ativos(j).sort((a,b)=>(a.d+a.h).localeCompare(b.d+b.h));return a[a.length-1]||null}
function refDate(j){const p=proxima(j);return p?p.d:(ultima(j)?.d||j.em.slice(0,10))}
const aprovador=j=>j.med==="Dra. Catarina"?"Dra. Catarina":"Dr. Gonçalo";
const souAprovador=j=>state.user&&state.user.n===aprovador(j);
function etapas(j){
  const cfg=ETAPAS[j.tp]||ETAPAS.outro, alvo=proxima(j), fim=["pronto","entregue","arquivado"].includes(j.st), out=[];
  let prev=j.em.slice(0,10), prevOk=true;
  cfg.forEach((e,i)=>{
    const s=j.etp[i]||{};
    const feita=!!s.feito||fim||(j.imp&&i<cfg.length-1);
    const aprovPend=!!e.ap&&!!s.feito&&!s.aprov&&!fim;
    const ok=feita&&!aprovPend;
    let due=null;
    if(e.r==="d"){ if(alvo) due=subBiz(alvo.d,e.d) }
    else if(e.r==="p") due=addBiz(j.em.slice(0,10),e.d);
    else if(prevOk) due=addBiz(prev,e.d);
    if(j.imp&&i===cfg.length-1) due=alvo?subBiz(alvo.d,e.r==="d"?e.d:1):null;
    if(s.adiado&&!feita) due=s.adiado;
    const ativo=j.st==="aceite";
    const pedir=ativo&&!feita&&due&&due<=TODAY&&(e.r!=="a"||prevOk);
    out.push({i,n:e.n,r:e.r,ap:!!e.ap,due,feita,ok,aprovPend,aprov:s.aprov,adiado:s.adiado,feitoEm:s.feito,
      pedir,atrasada:pedir&&due<TODAY,espera:e.r==="a"&&!prevOk&&!feita});
    if(ok){prev=s.aprovEm||s.feito||prev;prevOk=true}else prevOk=false;
  });
  return out;
}
function estado(j){
  if(j.st==="entregue") return {l:"Entregue",t:"done",ic:"ok"};
  if(j.st==="arquivado") return {l:"Arquivado",t:"done",ic:"done"};
  if(j.st==="continuado") return {l:"Continuado",t:"done",ic:"done"};
  if(j.st==="sem_data") return {l:"Sem data",t:"",ic:"cal"};
  if(j.st==="novo") return {l:"Por aceitar",t:"new",ic:"new"};
  if(j.st==="nova-data") return {l:"Nova data proposta",t:"warn",ic:"warn"};
  if(j.falta) return {l:"Falta componente",t:"crit",ic:"crit"};
  const p=proxima(j);
  if(j.st==="pronto") return {l:p&&p.c?"Pronto · confirmado":"Pronto",t:"ok",ic:"ok"};
  if(!p) return {l:"Em atraso",t:"crit",ic:"crit"};
  if(p.c) return {l:"Confirmado",t:"ok",ic:"ok"};
  const ET=etapas(j);
  const ap=ET.find(e=>e.aprovPend); if(ap) return {l:`${ap.n} para aprovar`,t:"new",ic:"new"};
  if(j.labSt==="stand_by") return {l:"Stand-by",t:"warn",ic:"warn"};
  if(j.labSt==="aguarda_dr") return {l:"Aguarda ok do Dr.",t:"warn",ic:"warn"};
  if(ET.some(e=>e.atrasada)) return {l:"Etapa atrasada",t:"warn",ic:"warn"};
  const ad=ET.find(e=>e.adiado&&!e.feita); if(ad) return {l:`${ad.n} adiado p/ ${fmtS(ad.adiado)}`,t:"warn",ic:"warn"};
  if(diff(TODAY,p.d)<=1) return {l:"Por confirmar",t:"warn",ic:"warn"};
  const feitas=ET.filter(e=>e.feitoEm); if(feitas.length) return {l:`${feitas[feitas.length-1].n} feito`,t:"",ic:""};
  if(j.labSt&&LABEST[j.labSt]) return {l:LABEST[j.labSt],t:"",ic:""};
  return {l:"Em produção",t:"",ic:""};
}
const aberto=j=>["novo","aceite","pronto","nova-data"].includes(j.st);
function perguntas(){ /* o que o Milner tem de responder hoje */
  const out=[];
  for(const j of JOBS){ if(j.st!=="aceite") continue; for(const e of etapas(j)) if(e.pedir) out.push({j,e}); }
  return out.sort((a,b)=>a.e.due.localeCompare(b.e.due));
}
function aprovacoes(){ return JOBS.filter(j=>j.st==="aceite"&&souAprovador(j)).flatMap(j=>etapas(j).filter(e=>e.aprovPend).map(e=>({j,e}))); }
function alertas(){
  const out=[];
  for(const j of JOBS){
    if(!aberto(j)||!visivel(j)) continue;
    const who=`${j.u} · ${TIPOS[j.tp].n}`, p=proxima(j);
    if(lab()&&j.st==="novo") out.push({t:"new",m:`Novo pedido: ${j.u}`,s:`${TIPOS[j.tp].n} · ${p?fmt(p.d):"sem data"}`,id:j.id,o:1});
    if(lab()&&j.pedeConf&&!(p&&p.c)) out.push({t:"new",m:`Pedem confirmação: ${j.u}`,s:`${p?fmt(p.d)+(p.h?" às "+p.h:""):""} · ${j.cl}`,id:j.id,o:1});
    if(lab()&&j.pedeEstado) out.push({t:"new",m:`Pedem ponto de situação: ${j.u}`,s:who,id:j.id,o:2});
    if(!lab()&&j.st==="nova-data") out.push({t:"warn",m:`Milner propõe ${fmt(j.novaData)}`,s:who,id:j.id,o:1});
    if(j.falta) out.push({t:"crit",m:`Falta ${j.falta}`,s:who,id:j.id,o:0});
    if(j.st==="aceite"&&p){
      const ET=etapas(j);
      if(!lab()){
        const at=ET.find(e=>e.atrasada&&e.i<ET.length-1);
        if(at) out.push({t:"warn",m:`${at.n} previsto para ${fmtS(at.due)} ainda sem resposta`,s:who,id:j.id,o:3});
        const ad=ET.find(e=>e.adiado&&!e.feita); if(ad&&!at) out.push({t:"warn",m:`Milner adiou ${ad.n.toLowerCase()} para ${fmt(ad.adiado)}`,s:who,id:j.id,o:3});
        const ap=ET.find(e=>e.aprovPend); if(ap&&!souAprovador(j)) out.push({t:"new",m:`${ap.n} à espera de aprovação (${aprovador(j)})`,s:who,id:j.id,o:3});
      } else {
        const ap=ET.find(e=>e.aprovPend); if(ap) out.push({t:"new",m:`${ap.n} enviado para aprovação de ${aprovador(j)}`,s:who,id:j.id,o:4});
      }
      const d=diff(TODAY,p.d);
      if(lab()&&d>=0&&d<=1&&!p.c) out.push({t:"crit",m:`${p.f==="prova"?"Prova":"Entrega"} ${d===0?"hoje":"amanhã"}${p.h?" às "+p.h:""}. Já está pronto?`,s:who,id:j.id,o:0});
    }
    if(j.st==="aceite"&&!p&&ultima(j)&&!j.imp) out.push({t:"crit",m:`Em atraso desde ${fmtS(ultima(j).d)}`,s:who,id:j.id,o:0});
  }
  return out.sort((a,b)=>a.o-b.o);
}

function etapaRow(j,x,L){
  let sub,acts="";
  if(x.feita&&x.aprovPend){
    sub=`Feito a ${fmtS(x.feitoEm)} · à espera de aprovação de ${aprovador(j)}`;
    if(souAprovador(j)) acts=`<button class="pill green" data-etap="ok" data-id="${j.id}" data-i="${x.i}">Aprovar</button><button class="pill ghost" data-etap="skip" data-id="${j.id}" data-i="${x.i}">Dispensar</button>`;
  } else if(x.feita){
    sub=x.feitoEm?`Feito a ${fmtS(x.feitoEm)}${x.aprov==="ok"?` · aprovado por ${aprovador(j)}`:x.aprov==="skip"?" · aprovação dispensada":""}`:"Feito";
  } else if(x.espera){ sub=`Começa a contar quando a etapa anterior estiver ${ETAPAS[j.tp]?.[x.i-1]?.ap?"aprovada":"feita"}`;
  } else if(x.due){ sub=`${x.adiado?"Adiado para":x.pedir?"Perguntar":"Previsto"} ${fmt(x.due)}${x.atrasada?" · sem resposta":""}`;
    if(L&&j.st==="aceite") acts=`<button class="pill green" data-etf="${j.id}" data-i="${x.i}">Feito</button><button class="pill ghost" data-etad="1" data-id="${j.id}" data-i="${x.i}">+24 h</button><button class="pill ghost" data-etad="2" data-id="${j.id}" data-i="${x.i}">+48 h</button>`;
  } else sub="—";

  return `<div class="rowi wrapt" style="flex-wrap:wrap">
    <button class="check ${cls}" ${L&&x.feitoEm&&j.st==="aceite"?`data-etundo="${j.id}" data-i="${x.i}"`:"disabled"} aria-label="${esc(x.n)}">${cls?"✓":x.aprovPend?"…":""}</button>
    <span class="main" style="min-width:150px"><div class="t">${esc(x.n)}${x.ap?` <span class="tag tag-new" style="font-size:.66rem">aprovação</span>`:""}</div><div class="s" style="${x.atrasada||x.adiado&&!x.feita?"color:var(--orange)":""}">${sub}</div></span>
    ${acts?`<span style="display:flex;gap:6px;flex:none;margin-left:auto">${acts}</span>`:""}</div>`;
}

function dateWarn(F){

function shrink(file){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,1400/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",.82))};im.onerror=()=>res(r.result);im.src=r.result};r.readAsDataURL(file)})}

async function lerImed(file){
  let rows=[];
  if(/\.xlsx?$/i.test(file.name)){
    if(!window.XLSX) await new Promise((ok,ko)=>{const sc=document.createElement("script");sc.src="https:\/\/cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";sc.onload=ok;sc.onerror=ko;document.head.append(sc)});
    const wb=XLSX.read(await file.arrayBuffer(),{type:"array"}); rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false});
  } else { const t=await file.text(); const sep=(t.split("\n")[0].match(/;/g)||[]).length>(t.split("\n")[0].match(/,/g)||[]).length?";":","; rows=t.split(/\r?\n/).map(l=>l.split(sep).map(x=>x.replace(/^"|"$/g,"").trim())); }
  rows=rows.filter(r=>r&&r.length);
  const head=(rows[0]||[]).map(h=>String(h||"").toLowerCase());
  let col=head.findIndex(h=>/nome/.test(h)&&!/m[ée]dico/.test(h)); let start=1;
  if(col<0){ /* sem cabeçalho: escolhe a coluna com mais texto de várias palavras */
    const sc=head.map((_,i)=>rows.slice(0,50).filter(r=>/^[A-Za-zÀ-ÿ' .-]+$/.test(String(r[i]||""))&&String(r[i]).trim().split(/\s+/).length>=2).length); col=sc.indexOf(Math.max(...sc)); start=0; }
  const seen=new Set(); IMED=[];
  for(const r of rows.slice(start)){const n=String(r[col]||"").replace(/\s+/g," ").trim(); if(n.split(" ").length<2) continue; const key=n.toLowerCase(); if(seen.has(key)) continue; seen.add(key); IMED.push({n:n.replace(/\b([a-zà-ÿ])/g,(m,c,o,str)=>n===n.toUpperCase()?c.toUpperCase():m),k:normT(n)});}
  if(IMED.some(p=>p.n===p.n.toUpperCase())) IMED.forEach(p=>{p.n=p.n.toLowerCase().replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()).replace(/\b(De|Da|Do|Dos|Das|E)\b/g,w=>w.toLowerCase())});
}

      case "propor": {const x=$("#b-data").value; if(!x) return; j.novaData=x; j.st="nova-data"; state.box=null; log(j,`Milner propõe ${fmt(x)}`); toast("Proposta enviada à clínica"); break;}
      case "aceitardata": if(p){log(j,`Clínica aceitou ${fmt(j.novaData)} (era ${fmt(p.d)})`);p.d=j.novaData;p.c=false} j.novaData=null; j.st="aceite"; break;
      case "recusardata": log(j,"Clínica mantém a data"); j.novaData=null; j.st="novo"; break;
      case "alterar": {const x=$("#b-ad").value,h=$("#b-ah").value; if(!x) return; if(p){log(j,`Consulta alterada: ${fmtS(p.d)}${p.h?" "+p.h:""} → ${fmtS(x)}${h?" "+h:""}`);p.d=x;p.h=h;p.c=false} else {j.dt.push({d:x,h,f:"entrega",x:"",c:false,o:false});log(j,`Nova data: ${fmtS(x)}`)} if(j.st==="sem_data")j.st="aceite"; state.box=null; toast("Data alterada. O Milner foi avisado."); break;}
      case "desmarcou": if(p){p.o=true;log(j,`Paciente desmarcou (${fmtS(p.d)})`)} state.box=null; break;
      case "falta": {const x=$("#b-falta").value.trim(); if(!x) return; const fp=[...document.querySelectorAll("[data-fp][aria-pressed=true]")].map(b=>b.dataset.fp); if(!fp.length){toast("Escolha a quem avisar");return} j.faltaPara=fp; j.faltaPri=(document.querySelector("[data-fpri][aria-pressed=true]")||{dataset:{fpri:"u"}}).dataset.fpri; j.falta=x; j.labSt="falta_componente"; state.box=null; log(j,`Falta componente: ${x}`); j.ms.push({de:"lab",txt:`Falta componente: ${x}`,q:nowS()}); toast("Aviso enviado"); break;}
      case "recebido": log(j,`Componente recebido (${j.falta})`); j.falta=null; j.labSt="em_curso"; break;
      case "pronto": (ETAPAS[j.tp]||ETAPAS.outro).forEach((c,i)=>{if(!j.etp[i]?.feito) j.etp[i]={...(j.etp[i]||{}),feito:TODAY}}); j.st="pronto"; j.labSt="pronto"; j.pedeEstado=null; log(j,"Pronto na gaveta"); toast("Marcado como pronto"); break;
      case "adiar": j.labSt="adiado"; log(j,"Milner: não vai estar a tempo"); j.ms.push({de:"lab",txt:"Não vai estar pronto a tempo. Temos de adiar.",q:nowS()}); toast("Clínica avisada"); break;
      case "entregue": j.st="entregue"; log(j,`Entregue (${state.user.n})`); break;
    }
    ev.stopPropagation(); render(); return;
  }
  const o=T.closest("[data-open]"); if(o){state.sheet=o.dataset.open;state.box=null;renderSheet();return}
  if(T.closest("[data-close]")){state.sheet=null;state.box=null;render();return}
});

/* ======================= App instalada: rosto/impressão digital, cópia local, atualizações ======================= */
const BIO={get(){try{return JSON.parse(localStorage.getItem("xl-bio")||"null")}catch(e){return null}},set(v){try{localStorage.setItem("xl-bio",JSON.stringify(v))}catch(e){}},del(){try{localStorage.removeItem("xl-bio");localStorage.removeItem("xl-dados")}catch(e){}}};
const b64=a=>btoa(String.fromCharCode(...new Uint8Array(a))), unb64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0)), rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function bioDisponivel(){try{return !!(window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){return false}}
function guardarLocal(){if(!BIO.get()||!state.user)return;try{localStorage.setItem("xl-dados",JSON.stringify({user:state.user,dados:{rev:SRV.rev,trabalhos:JOBS,cfg:cfgAtual()}}))}catch(e){}}
document.addEventListener("visibilitychange",()=>{if(document.hidden)guardarLocal()});
async function oferecerBio(cred){
  if(BIO.get()||store.get("xl-bio-nao")||!state.user||!(await bioDisponivel()))return;
  const ov=document.createElement("div");ov.className="biooffer";
  ov.innerHTML=`<div class="bio-c"><b>Entrar com o rosto ou a impressão digital?</b><p>Neste aparelho, da próxima vez abres a app sem código.</p><div class="chips"><button class="pill" data-bio="sim">Ativar</button><button class="pill ghost" data-bio="nao">Agora não</button></div></div>`;
  document.body.append(ov);
  ov.onclick=async ev=>{const b=ev.target.closest("[data-bio]");if(!b)return;
    if(b.dataset.bio==="nao"){store.set("xl-bio-nao","1");ov.remove();return}
    try{
      const c=await navigator.credentials.create({publicKey:{rp:{name:"Executive Lab"},user:{id:rnd(16),name:state.user.n,displayName:state.user.n},challenge:rnd(32),pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required",residentKey:"discouraged"},timeout:60000}});
      const r=await API("registarAparelho",cred,((navigator.userAgent.match(/\(([^)]+)\)/)||[])[1]||"aparelho").slice(0,60));
      if(!r.ok)throw new Error(r.erro);
      BIO.set({id:b64(c.rawId),token:r.token,n:state.user.n});guardarLocal();ov.remove();
      toast("Pronto. Da próxima vez entras com o rosto ou a impressão digital.");
    }catch(e){ov.remove();toast("Não foi possível ativar. Continua a entrar com o código.")}
  };
}
function sairJa(){state.user=null;SRV.pin=null;JOBS=[];state.sheet=null;state.view="trabalhos";state.filter=null;render()}
async function entrarBio(){
  const b=BIO.get();if(!b||state.busy)return;
  try{await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:"public-key",id:unb64(b.id)}],userVerification:"required",timeout:60000}})}
  catch(e){state.perr="Não foi reconhecido. Tenta outra vez ou usa o código.";return pinVer()}
  let cache=null;try{cache=JSON.parse(localStorage.getItem("xl-dados")||"null")}catch(e){}
  if(cache&&cache.dados&&cache.user){
    entrar(b.token,{ok:true,user:cache.user,dados:cache.dados},true);
    API("login",b.token).then(r=>{
      if(r.ok){if(!SRV.dirty.size&&!SRV.saving){const ab=state.sheet;carregar(r.dados);state.user={...r.user};state.sheet=ab;render();guardarLocal()}}
      else{BIO.del();sairJa();state.perr="Este aparelho tem de voltar a entrar com o código.";renderLogin()}
    }).catch(()=>estadoLigacao("Sem ligação. A mostrar a última cópia.",true));
    return;
  }
  state.busy=true;pinVer();
  let r;try{r=await API("login",b.token)}catch(e){r={ok:false,erro:"Sem ligação ao servidor. Tenta outra vez."}}
  state.busy=false;
  if(!r.ok){if(!/ligação/.test(r.erro||""))BIO.del();state.perr=r.erro||"Erro";return renderLogin()}
  entrar(b.token,r,true);
}
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    const ativar=()=>reg.waiting&&reg.waiting.postMessage("ativar");
    const avisar=()=>{if(!state.user)return ativar();if(document.querySelector(".upd"))return;const el=document.createElement("button");el.className="upd";el.textContent="Há uma versão nova · Atualizar";el.onclick=()=>{gravar();ativar()};document.body.append(el)};
    if(reg.waiting)avisar();
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)avisar()})});
    setInterval(()=>reg.update().catch(()=>{}),20*60e3);
    document.addEventListener("visibilitychange",()=>{if(!document.hidden)reg.update().catch(()=>{})});
  }).catch(()=>{});
  let rl=false;navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!rl){rl=true;location.reload()}});
}
/* ======================= Notificações no telefone ======================= */
const IDB={db:null,abrir(){return this.db||(this.db=new Promise((ok,ko)=>{const r=indexedDB.open("xl",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}))},
  async get(k){const d=await this.abrir();return new Promise(ok=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>ok(undefined)})},
  async set(k,v){const d=await this.abrir();return new Promise(ok=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>ok();t.onerror=()=>ok()})}};
const NOTIF={
  suporta(){return "serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window},
  iosSemInstalar(){return /iPhone|iPad|iPod/.test(navigator.userAgent)&&!navigator.standalone&&!matchMedia("(display-mode: standalone)").matches},
  on(){return store.get("xl-notif")==="1"&&this.suporta()&&Notification.permission==="granted"},
  estado(){if(this.on())return "Ativas neste aparelho";if(this.iosSemInstalar())return "No iPhone, primeiro adicione a app ao ecrã principal";if(!this.suporta())return "Este aparelho não suporta";if(Notification.permission==="denied")return "Bloqueadas nas definições do telefone";return "Desligadas"}
};
const b64uBytes=t=>{t=t.replace(/-/g,"+").replace(/_/g,"/");while(t.length%4)t+="=";return unb64(t)};
async function subscreverPush(cred){
  const reg=await navigator.serviceWorker.ready;
  let sub=await reg.pushManager.getSubscription();
  if(!sub){const k=await API("chavePush",cred);if(!k.ok)throw new Error(k.erro);sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uBytes(k.k)})}
  const r=await API("registarPush",cred,JSON.stringify(sub));if(!r.ok)throw new Error(r.erro);
  await IDB.set("pt",r.pt);await IDB.set("srv",SERVIDOR);if(!(await IDB.get("desde")))await IDB.set("desde",Date.now());
  store.set("xl-notif","1");store.set("xl-notif-ep",sub.endpoint);
}
async function ativarNotif(){
  if(NOTIF.iosSemInstalar()){toast("No iPhone: Partilhar → Adicionar ao ecrã principal, e abrir a app pelo ícone.");return false}
  if(!NOTIF.suporta()){toast("Este aparelho não suporta notificações.");return false}
  const p=await Notification.requestPermission();
  if(p!=="granted"){toast(p==="denied"?"As notificações estão bloqueadas nas definições do telefone.":"Notificações não ativadas.");return false}
  try{await subscreverPush(SRV.pin);toast("Notificações ativas. Recebes os avisos mesmo com a app fechada.");return true}
  catch(e){toast("Não consegui ativar as notificações: "+(e.message||e));return false}
}
async function desligarNotif(){
  try{const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();if(sub){await API("desligarPush",SRV.pin,sub.endpoint).catch(()=>{});await sub.unsubscribe()}}catch(e){}
  store.del("xl-notif");store.set("xl-notif-nao","1");toast("Notificações desligadas neste aparelho");
}
/* depois de entrar: renova a subscrição em silêncio, ou oferece ativar (uma vez) */
async function verNotifAoEntrar(){
  if(!state.user||!NOTIF.suporta())return;
  if(store.get("xl-notif")==="1"&&Notification.permission==="granted"){try{await subscreverPush(SRV.pin)}catch(e){}return}
  if(store.get("xl-notif-nao")||Notification.permission==="denied"||NOTIF.iosSemInstalar())return;
  for(let i=0;i<60&&document.querySelector(".biooffer");i++)await new Promise(r=>setTimeout(r,1000));
  if(!state.user||document.querySelector(".biooffer"))return;
  const ov=document.createElement("div");ov.className="biooffer";
  ov.innerHTML=`<div class="bio-c"><b>Receber avisos no telefone?</b><p>Quando chega um pedido ou o trabalho muda de estado, o telefone avisa, mesmo com a app fechada.</p><div class="chips"><button class="pill" data-nt="sim">Ativar</button><button class="pill ghost" data-nt="nao">Agora não</button></div></div>`;
  document.body.append(ov);
  ov.onclick=async ev=>{const b=ev.target.closest("[data-nt]");if(!b)return;ov.remove();
    if(b.dataset.nt==="nao"){store.set("xl-notif-nao","1");return}
    await ativarNotif();if(state.view==="ajustes")render()};
}
